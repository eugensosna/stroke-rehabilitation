logging:
  console:
    enabled: true
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/stroke}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:<<YOUR_PASSWORD>>}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  docker:
    compose:
      lifecycle-management: start-only
error:
  handling:
    http-status-in-json-response: true
    exception-logging: with-stacktrace
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      GameStatisticUnique: GAME_STATISTIC_UNIQUE
springdoc:
  pathsToMatch: /api/**
jwt:
  secret: test-secret-key-for-testing-only-do-not-use-in-production
  refresh-token-expiration-second: 7000
  expiration: 3600000
  access-token-expiration-second: 600
stroke:
  cors:
    allowed-origins: "http://localhost:5173, http://localhost:8080"
  init:
    users:
      - email: admin@admin.com
        password: admin123
        role: ADMIN
      - email: user@user.com
        password: user123
        role: USER




