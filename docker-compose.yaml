services:
  db:
    image: postgres:18.4
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-stroke}
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-P4ssword!}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-stroke}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-stroke}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-P4ssword!}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_ALLOWED_ORIGINS: "${SPRING_ALLOWED_ORIGINS:-http://localhost:5173, http://localhost:8080}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
volumes:
  db_data:
  frontend_node_modules:
