services:
  db:
    image: postgres:18.4
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-stroke}
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-P4ssword!}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-stroke}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgres:/var/lib/postgresql
    networks:
      - postgres
      - pgadmin
      - stroke
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-stroke}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-P4ssword!}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_ALLOWED_ORIGINS: "${SPRING_ALLOWED_ORIGINS:-http://localhost:5173, http://localhost:8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${LISTEN_BACKEND_PORT:-8080}:8080'
    networks:
      - proxy
      - stroke
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
    working_dir: /app
    environment:
       - VITE_API_PROXY_TARGET=${VITE_API_BASE_URL:-http://localhost:8080}
       - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - '${LISTEN_FRONTEND_PORT:-5173}:3080'
    networks:
      - proxy
      - stroke
    
volumes:
  db_data:

networks:
  stroke:
    driver: bridge
  proxy:
    external: true
  postgres: 
    external: true
  pgadmin:
    external: true