<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="clean-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A86FF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 15)">
    <!-- Outer Heart/Ribbon Path -->
    <path d="M 50 85 C 20 60, 10 40, 25 22 C 38 7, 50 25, 50 25 C 50 25, 62 7, 75 22 C 90 40, 80 60, 50 85 Z" 
          fill="none" 
          stroke="url(#clean-blue)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Central Spinal / Recovery Nodes -->
    <circle cx="50" cy="32" r="4" fill="#3A86FF" />
    <circle cx="50" cy="46" r="4" fill="#20B2AA" />
    <circle cx="50" cy="60" r="4" fill="#00F5D4" />
  </g>

  <!-- Typography -->
  <text x="125" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" letter-spacing="-0.5" fill="#1D2A44">
    Rehabilitation
  </text>
</svg>
