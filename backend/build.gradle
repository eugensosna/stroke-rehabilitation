plugins {
  id 'org.springframework.boot' version '4.1.2'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'java'
  id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'ua.edu.zsea.sosna'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

springBoot {
  mainClass = 'ua.edu.zsea.sosna.stroke.StrokeApplication'
}

bootRun {
  environment SPRING_PROFILES_ACTIVE: environment.SPRING_PROFILES_ACTIVE ?: 'dev'
}

repositories {
  mavenCentral()
}

dependencies {
  implementation('org.springframework.boot:spring-boot-starter-web')
  implementation('org.springframework.boot:spring-boot-starter-websocket')
  implementation('org.springframework.boot:spring-boot-starter-validation')
  implementation('org.springframework.boot:spring-boot-starter-data-jpa')
  implementation('org.springframework.boot:spring-boot-starter-liquibase')
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.security:spring-security-oauth2-jose'
  implementation('com.auth0:java-jwt:4.6.2')
  developmentOnly( 'org.springframework.boot:spring-boot-devtools')
  
  runtimeOnly('org.postgresql:postgresql')
  implementation('io.github.wimdeblauwe:error-handling-spring-boot-starter:5.1.1')
  implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0')
  compileOnly('org.projectlombok:lombok')
  annotationProcessor('org.projectlombok:lombok')
  testCompileOnly('org.projectlombok:lombok')
  testAnnotationProcessor('org.projectlombok:lombok')
  developmentOnly('org.springframework.boot:spring-boot-docker-compose')
  testImplementation('org.springframework.boot:spring-boot-starter-test')
  testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testRuntimeOnly 'com.h2database:h2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {

  useJUnitPlatform()
}