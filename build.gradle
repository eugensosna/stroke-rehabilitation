plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'ua.edu.zsea.sosna'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

bootRun {
    environment SPRING_PROFILES_ACTIVE: environment.SPRING_PROFILES_ACTIVE ?: 'local'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-validation')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation('com.auth0:java-jwt:4.5.1')
    runtimeOnly('org.postgresql:postgresql')
    // implementation('io.github.wimdeblauwe:error-handling-spring-boot-starter:5.1.1')
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3')
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor('org.projectlombok:lombok')
    developmentOnly('org.springframework.boot:spring-boot-docker-compose')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
      testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

node {
    download.set(true)
    version.set('24.16.0')
}

tasks.register('npmRunBuild', NpmTask) {
    // args = ['run', 'build']
    args = ['install']
    // dependsOn npmInstall

    // inputs.files(fileTree('node_modules'))
    // inputs.files(fileTree('src/main/webapp'))
    // inputs.file('.env')
    // inputs.file('package.json')
    // inputs.file('tsconfig.json')
    // inputs.file('webpack.config.js')
    // outputs.dir(layout.buildDirectory.dir('resources/main/static'))
}

processResources {
    // dependsOn npmRunBuild
}

tasks.withType(Test) {
    useJUnitPlatform()
}
